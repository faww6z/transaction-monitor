server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/txn_monitor
    username: appuser
    password: apppass
  jpa:
    hibernate:
      # Flyway owns the schema now. Hibernate must not create or alter tables.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

# Demo credentials for the analyst login and the ingest API.
# Override in real deployments via APP_SECURITY_USERNAME / APP_SECURITY_PASSWORD.
app:
  security:
    username: analyst
    password: analyst
